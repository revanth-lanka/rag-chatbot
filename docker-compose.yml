services:
  frontend:
    build:
      context: ./frontend
    container_name: rag_chatbot_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_CHAT_TOP_K_DEFAULT: ${VITE_CHAT_TOP_K_DEFAULT:-3}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: rag_chatbot_backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-RAG Chatbot Backend}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      POSTGRES_DB: ${POSTGRES_DB:-rag_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DB_ECHO: ${DB_ECHO:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-300}
      VECTOR_SIZE: ${VECTOR_SIZE:-384}
      DB_INIT_MAX_RETRIES: ${DB_INIT_MAX_RETRIES:-10}
      DB_INIT_RETRY_DELAY: ${DB_INIT_RETRY_DELAY:-2.0}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      DEFAULT_TEXT_FILENAME: ${DEFAULT_TEXT_FILENAME:-text-input.txt}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-30}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      LOCAL_EMBEDDING_DEVICE: ${LOCAL_EMBEDDING_DEVICE:-cpu}
      LOCAL_EMBEDDING_RUNTIME: ${LOCAL_EMBEDDING_RUNTIME:-onnx}
      LOCAL_EMBEDDING_BATCH_SIZE: ${LOCAL_EMBEDDING_BATCH_SIZE:-64}
      LOCAL_EMBEDDING_ENCODE_BATCH_SIZE: ${LOCAL_EMBEDDING_ENCODE_BATCH_SIZE:-32}
      LOCAL_EMBEDDING_WARMUP_ENABLED: ${LOCAL_EMBEDDING_WARMUP_ENABLED:-true}
      LOCAL_EMBEDDING_WARMUP_MODE: ${LOCAL_EMBEDDING_WARMUP_MODE:-blocking}
      LOCAL_EMBEDDING_WARMUP_TEXT: ${LOCAL_EMBEDDING_WARMUP_TEXT:-Warm up the local embedding model.}
      LOCAL_EMBEDDING_ONNX_MODEL_DIR: ${LOCAL_EMBEDDING_ONNX_MODEL_DIR:-/code/.cache/local-embedding-onnx}
      LOCAL_EMBEDDING_ONNX_INTRA_OP_THREADS: ${LOCAL_EMBEDDING_ONNX_INTRA_OP_THREADS:-0}
      LOCAL_EMBEDDING_ONNX_INTER_OP_THREADS: ${LOCAL_EMBEDDING_ONNX_INTER_OP_THREADS:-0}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-700}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0.2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_CHAT_MODEL: ${GROQ_CHAT_MODEL:-llama-3.1-8b-instant}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-openrouter/free}
      RETRIEVAL_TOP_K_DEFAULT: ${RETRIEVAL_TOP_K_DEFAULT:-3}
      RETRIEVAL_TOP_K_MAX: ${RETRIEVAL_TOP_K_MAX:-10}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-exact}
      RETRIEVAL_CANDIDATE_K: ${RETRIEVAL_CANDIDATE_K:-40}
      RETRIEVAL_SIMILARITY_THRESHOLD: ${RETRIEVAL_SIMILARITY_THRESHOLD:-0.3}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-groq}
      CHAT_TOP_K_DEFAULT: ${CHAT_TOP_K_DEFAULT:-3}
      CHAT_TOP_K_MAX: ${CHAT_TOP_K_MAX:-10}
      CHAT_RETRIEVAL_FETCH_K: ${CHAT_RETRIEVAL_FETCH_K:-10}
      CHAT_RERANK_STRATEGY_DEFAULT: ${CHAT_RERANK_STRATEGY_DEFAULT:-hybrid}
      CHAT_CONTEXT_MAX_CHARS: ${CHAT_CONTEXT_MAX_CHARS:-2400}
      CHAT_CONTEXT_MAX_CHUNKS: ${CHAT_CONTEXT_MAX_CHUNKS:-3}
      CHAT_CONTEXT_PER_CHUNK_MAX_CHARS: ${CHAT_CONTEXT_PER_CHUNK_MAX_CHARS:-900}
      FLASHRANK_ENABLED: ${FLASHRANK_ENABLED:-true}
      FLASHRANK_WARMUP_ENABLED: ${FLASHRANK_WARMUP_ENABLED:-false}
      FLASHRANK_MODEL: ${FLASHRANK_MODEL:-ms-marco-TinyBERT-L-2-v2}
      FLASHRANK_NEURAL_TOP_N: ${FLASHRANK_NEURAL_TOP_N:-15}
      FLASHRANK_HYBRID_TOP_N: ${FLASHRANK_HYBRID_TOP_N:-10}
      CHAT_STREAM_CHUNK_WORDS: ${CHAT_STREAM_CHUNK_WORDS:-8}
      CHAT_STREAM_DELAY_MS: ${CHAT_STREAM_DELAY_MS:-75}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      HF_HOME: ${HF_HOME:-/code/.cache/huggingface}
      TRANSFORMERS_CACHE: ${TRANSFORMERS_CACHE:-/code/.cache/huggingface/transformers}
    ports:
      - "8000:8000"
    volumes:
      - backend_cache:/code/.cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_chatbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backend_cache:
